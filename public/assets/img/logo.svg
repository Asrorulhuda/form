<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90" fill="none">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="60%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="logoSheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="logoAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="textBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#312e81" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon Section -->
  <g transform="translate(10, 10)">
    <!-- Base Rounded Container -->
    <rect x="0" y="0" width="70" height="70" rx="18" fill="url(#logoBgGrad)" filter="url(#logoShadow)"/>
    <rect x="1" y="1" width="68" height="68" rx="17" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" fill="none"/>

    <!-- Back Rotated Sheet -->
    <rect x="19" y="13" width="32" height="42" rx="4.5" fill="#6366f1" fill-opacity="0.65" transform="rotate(6 35 34)"/>

    <!-- Front Sheet -->
    <rect x="16" y="13" width="34" height="43" rx="5" fill="url(#logoSheetGrad)"/>
    <rect x="16" y="13" width="34" height="43" rx="5" stroke="rgba(255,255,255,0.9)" stroke-width="0.8" fill="none"/>

    <!-- Corner Fold -->
    <path d="M40 13 L50 23 L40 23 Z" fill="#c7d2fe"/>

    <!-- Content Lines -->
    <rect x="22" y="24" width="16" height="2.5" rx="1.25" fill="#4f46e5" fill-opacity="0.85"/>
    <rect x="22" y="30" width="22" height="2" rx="1" fill="#94a3b8"/>
    <rect x="22" y="35" width="18" height="2" rx="1" fill="#94a3b8"/>

    <!-- Seal Checkmark -->
    <circle cx="42" cy="46" r="9.5" fill="url(#logoAccentGrad)" filter="url(#logoShadow)"/>
    <circle cx="42" cy="46" r="8.8" stroke="white" stroke-width="1.2" fill="none"/>
    <path d="M38 46 L41 49 L46.5 43" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography Section -->
  <g transform="translate(96, 22)">
    <!-- "ASR" Text -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="30" font-weight="900" letter-spacing="-0.5" fill="#0f172a">ASR</text>
    
    <!-- "FORM" Text in Brand Gradient -->
    <text x="72" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="30" font-weight="900" letter-spacing="-0.5" fill="url(#textBrandGrad)">FORM</text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2" text-transform="uppercase" fill="#64748b">SMART FORM &amp; DOC AUTOMATION</text>
  </g>
</svg>
